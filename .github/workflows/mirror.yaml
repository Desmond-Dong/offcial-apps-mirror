---
name: Mirror upstream repository

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force_sync:
        description: Force re-sync all images, ignoring tags already in ACR
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: mirror-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORIES: "esphome/home-assistant-addon music-assistant/home-assistant-addon home-assistant/addons"
  SKIP_ADDONS: "netease_cloud_music_api"
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: hassioapps
  REPO_NAME: Home Assistant Community Apps (Mirror)
  REPO_URL: https://github.com/Desmond-Dong/offcial-apps-mirror
  REPO_MAINTAINER: Desmond-Dong

jobs:
  mirror:
    name: Mirror repository files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Mirror add-ons from upstreams
        run: |
          set -euo pipefail
          for repo in ${UPSTREAM_REPOSITORIES}; do
            dest="${RUNNER_TEMP}/upstream-${repo%%/*}"
            git clone --depth 1 --quiet "https://github.com/${repo}.git" "${dest}"
            for d in "${dest}"/*/; do
              d="${d%/}"
              name="$(basename "${d}")"
              if [ ! -f "${d}/config.yaml" ]; then
                continue
              fi
              if [ -e "./${name}" ]; then
                echo "::warning::${name}: already provided by another upstream, keeping the first one"
                continue
              fi
              rsync -a --delete "${d}/" "./${name}/"
            done
          done

      - name: Point esphome image references at ACR
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "ghcr.io/esphome/"
          replace: "${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/"
          regex: false
          include: "*/config.yaml"

      - name: Point music-assistant image references at ACR
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "ghcr.io/music-assistant/"
          replace: "${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/"
          regex: false
          include: "*/config.yaml"

      - name: Point official core image references at ACR
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "image: homeassistant/"
          replace: "image: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/"
          regex: false
          include: "*/config.yaml"

      - name: Remove excluded add-ons
        run: |
          set -euo pipefail
          for name in ${SKIP_ADDONS}; do
            rm -rf "./${name}"
          done

      - name: Write repository.json
        run: |
          jq -n \
            --arg name "$REPO_NAME" \
            --arg url "$REPO_URL" \
            --arg maintainer "$REPO_MAINTAINER" \
            '{name: $name, url: $url, maintainer: $maintainer}' > repository.json

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: sync upstream repository"

  prepare:
    name: Prepare sync list
    runs-on: ubuntu-latest
    needs: mirror
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Build sync list from upstream configs
        id: list
        env:
          UPSTREAMS: "esphome/home-assistant-addon music-assistant/home-assistant-addon home-assistant/addons"
        run: |
          set -euo pipefail
          seen=""
          rows=()
          for repo in ${UPSTREAMS}; do
            dest="${RUNNER_TEMP}/up-${repo%%/*}"
            git clone --depth 1 --quiet "https://github.com/${repo}.git" "${dest}"
            for d in "${dest}"/*/; do
              d="${d%/}"
              cfg="${d}/config.yaml"
              [ -f "${cfg}" ] || continue
              dir_name="$(basename "${d}")"
              case " ${SKIP_ADDONS} " in *" ${dir_name} "*) continue ;; esac
              case "${seen} " in *" ${dir_name} "*) continue ;; esac
              version="$(awk '/^version:/{print $2; exit}' "${cfg}" | tr -d "\"'")"
              image="$(awk '/^image:/{print $2; exit}' "${cfg}" | tr -d "\"'")"
              if [ -z "${version}" ] || [ -z "${image}" ]; then
                echo "::warning::${dir_name}: config has no version or no image, skipping"
                continue
              fi
              seen="${seen}${dir_name} "

              # supervisor alias "homeassistant/..." -> ghcr.io/home-assistant
              case "${image}" in
                homeassistant/*) image="ghcr.io/home-assistant/${image#homeassistant/}" ;;
              esac

              # a trailing /{arch} placeholder (or no placeholder at all) means
              # the plain tag carries every platform (mode=index); an {arch}
              # left inside the path means one image per architecture
              # (mode=arch, official core add-ons)
              index_image="${image%%/\{arch\}}"
              case "${index_image}" in
                *"{arch}"*)
                  path="${index_image#*/}"
                  path="${path#*/}"
                  arches="$(awk '
                    /^arch:/ { f=1; next }
                    f && /^[ \t]*- / { sub(/^[ \t]*- /, ""); print; next }
                    f && !/^[ \t]*$/ { f=0 }
                  ' "${cfg}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
                  if [ -z "${arches}" ] || [ "${arches}" = "[]" ]; then
                    echo "::warning::${dir_name}: arch image without arch list, skipping"
                    continue
                  fi
                  rows+=("${path}"$'\t'"${version}"$'\t'"${image}"$'\t'"${dir_name}"$'\t'"arch"$'\t'"${arches}")
                ;;
                *)
                  name="${index_image##*/}"
                  case "${index_image%%/*}" in
                    *.*) src="${index_image}" ;;
                    *) src="docker.io/${index_image}" ;;
                  esac
                  rows+=("${name}"$'\t'"${version}"$'\t'"${src}"$'\t'"${dir_name}"$'\t'"index"$'\t'"[]")
                ;;
              esac
            done
          done
          matrix="$(printf '%s\n' "${rows[@]}" | jq -c -R -s '
            split("\n")
            | map(select(length > 0) | split("\t") |
                {name: .[0], version: .[1], src: .[2], label: .[3],
                 mode: .[4], arches: (.[5] | fromjson)})
          ')"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "will sync $(jq 'length' <<<"${matrix}") add-ons"

  sync-images:
    name: Sync ${{ matrix.addon.label }} to Aliyun ACR
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: needs.prepare.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Log in to Aliyun ACR
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          REG="$(printf '%s' "${ACR_REGISTRY}" | tr -d '[:space:]')"
          ACR_USER="$(printf '%s' "${ACR_USERNAME}" | tr -d '[:space:]')"
          PASS="$(printf '%s' "${ACR_PASSWORD}" | tr -d '[:space:]')"
          printf '%s' "${PASS}" | docker login "${REG}" --username "${ACR_USER}" --password-stdin
          echo "logged in to ${REG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sync images
        env:
          ADDON: ${{ matrix.addon.name }}
          LABEL: ${{ matrix.addon.label }}
          SRC: ${{ matrix.addon.src }}
          VERSION: ${{ matrix.addon.version }}
          MODE: ${{ matrix.addon.mode }}
          ARCHES: ${{ toJson(matrix.addon.arches) }}
          FORCE: ${{ inputs.force_sync || false }}
          DRY_RUN: "false"
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -uo pipefail

          PREFIX="${ACR_REGISTRY}/${ACR_NAMESPACE}"

          hassio_arch() {
            # Map a container platform (GOARCH + variant) to the HA arch name
            case "$1" in
              amd64) echo "amd64" ;;
              arm64) echo "aarch64" ;;
              386) echo "i386" ;;
              arm)
                case "${2:-}" in
                  v7) echo "armv7" ;;
                  *) echo "armhf" ;;
                esac ;;
              *) echo "$1" ;;
            esac
          }

          go_arch() {
            # Inverse of hassio_arch for --override-arch/--override-variant
            case "$1" in
              amd64) echo "amd64" ;;
              aarch64) echo "arm64" ;;
              i386) echo "386" ;;
              armhf) echo "arm v6" ;;
              armv7) echo "arm v7" ;;
              *) echo "$1" ;;
            esac
          }

          run_skopeo() {
            docker run --rm quay.io/skopeo/stable:latest "$@"
          }

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "- ⏳ **${LABEL}** (\`${PREFIX}/${ADDON}:${VERSION}\`): syncing" >> "${GITHUB_STEP_SUMMARY}"
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            echo "- 🔈 **${LABEL}**: dry run, nothing pushed" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # Aliyun ACR (personal edition) only accepts gzip-compressed docker
          # schema2 content, while upstream ships zstd-compressed OCI layers:
          # --format v2s2 --dest-compress-format gzip --dest-force-compress-format
          # converts on the fly. --override-* (global flags) additionally pick
          # exactly one platform out of a source index, dropping the
          # unknown/unknown provenance/SBOM attestation manifests that ACR
          # rejects ("403 blob type invalid").
          copy_one() {
            local src_ref="$1" dst="$2" goarch="$3" variant="$4"
            local override=(--override-os linux --override-arch "${goarch}")
            [ -n "${variant}" ] && override+=(--override-variant "${variant}")
            run_skopeo copy \
              "${override[@]}" \
              --format v2s2 \
              --dest-compress-format gzip \
              --dest-force-compress-format \
              --src-no-creds \
              --dest-creds "${ACR_USERNAME}:${ACR_PASSWORD}" \
              "docker://${src_ref}" "docker://${dst}"
          }

          synced=()
          failed=()

          if [ "${MODE}" = "arch" ]; then
            # One image per architecture, named with {arch} inside the path
            # (official core add-ons: {arch}-addon-<name>)
            while IFS= read -r harch; do
              [ -n "${harch}" ] || continue
              set -- $(go_arch "${harch}")
              dst="${PREFIX}/${NAME//\{arch\}/${harch}}:${VERSION}"
              src_ref="${SRC//\{arch\}/${harch}}:${VERSION}"

              if [ "${FORCE}" != "true" ] && docker buildx imagetools inspect "${dst}" >/dev/null 2>&1; then
                synced+=("${harch} (already up to date)")
                continue
              fi

              if copy_one "${src_ref}" "${dst}" "$1" "${2:-}"; then
                synced+=("${harch}")
              else
                failed+=("${harch}")
              fi
            done <<<"$(jq -r '.[]' <<<"${ARCHES}")"
          else
            # Plain tag is a multi-arch index: copy every real platform to a
            # per-arch tag, then rebuild the plain tag as an index over them
            src="${SRC}:${VERSION}"
            src_raw="$(docker buildx imagetools inspect --raw "${src}" 2>/dev/null || true)"
            if [ -z "${src_raw}" ]; then
              echo "- ⚠️ **${LABEL}** \`${VERSION}\`: upstream image not published yet (${src})" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            plats="$(jq -r '.manifests[]?
              | select((.platform.os // "") != "unknown" and (.platform.architecture // "") != "unknown")
              | "\(.platform.architecture)\t\(.platform.variant // "")"' <<<"${src_raw}" | sort -u)"
            if [ -z "${plats}" ]; then
              echo "- ⚠️ **${LABEL}** \`${VERSION}\`: no platform manifests in upstream index" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            tags=()
            while IFS=$'\t' read -r goarch variant; do
              harch="$(hassio_arch "${goarch}" "${variant}")"
              dst="${PREFIX}/${ADDON}-${harch}:${VERSION}"

              if [ "${FORCE}" != "true" ] && docker buildx imagetools inspect "${dst}" >/dev/null 2>&1; then
                synced+=("${harch} (already up to date)")
                tags+=("${dst}")
                continue
              fi

              if copy_one "${src}" "${dst}" "${goarch}" "${variant}"; then
                synced+=("${harch}")
                tags+=("${dst}")
              else
                failed+=("${harch}")
              fi
            done <<<"${plats}"

            if [ "${#failed[@]}" -eq 0 ] && [ "${#tags[@]}" -gt 0 ]; then
              if ! docker buildx imagetools create --tag "${PREFIX}/${ADDON}:${VERSION}" "${tags[@]}"; then
                failed+=("index rebuild")
              fi
            fi
          fi

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "- ❌ **${LABEL}** \`${VERSION}\`: failed: ${failed[*]}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          echo "- ✅ **${LABEL}** \`${VERSION}\`: ${#synced[@]} platform(s) [${synced[*]}]" >> "${GITHUB_STEP_SUMMARY}"
