---
name: Mirror upstream repository

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force_sync:
        description: Force re-sync all images, ignoring tags already in ACR
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: mirror-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: https://github.com/hassio-addons/repository.git
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: hassioapps
  REPO_NAME: Home Assistant Community Apps (Mirror)
  REPO_URL: https://github.com/Desmond-Dong/offcial-apps-mirror
  REPO_MAINTAINER: Desmond-Dong

jobs:
  mirror:
    name: Mirror repository files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Clone upstream repository
        run: git clone --depth 1 "$UPSTREAM_REPOSITORY" "$RUNNER_TEMP/upstream"

      - name: Mirror upstream tree
        run: rsync -a --delete --exclude '.git' --exclude '.github' "$RUNNER_TEMP/upstream/" ./

      - name: Point image references at ACR
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "ghcr.io/hassio-addons/"
          replace: "${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/"
          regex: false
          include: "*/config.yaml"

      - name: Turn arch placeholder into arch suffix
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "/{arch}"
          replace: "-{arch}"
          regex: false
          include: "*/config.yaml"

      - name: Point .apps.yml images at ACR
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "ghcr.io/hassio-addons/"
          replace: "${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/"
          regex: false
          include: ".apps.yml"

      - name: Point README at this repository
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "https://github.com/hassio-addons/repository"
          replace: "https://github.com/Desmond-Dong/offcial-apps-mirror"
          regex: false
          include: "README.md"

      - name: Write repository.json
        run: |
          jq -n \
            --arg name "$REPO_NAME" \
            --arg url "$REPO_URL" \
            --arg maintainer "$REPO_MAINTAINER" \
            '{name: $name, url: $url, maintainer: $maintainer}' > repository.json

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: sync upstream repository"

  prepare:
    name: Prepare sync list
    runs-on: ubuntu-latest
    needs: mirror
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: List add-ons to sync
        id: list
        run: |
          set -euo pipefail
          rows=()
          for cfg in */config.yaml; do
            addon="$(dirname "${cfg}")"
            version="$(awk '/^version:/{print $2; exit}' "${cfg}" | tr -d "\"'")"
            if [ -z "${version}" ]; then
              echo "::warning::${addon}: config.yaml has no version, skipping"
              continue
            fi
            rows+=("${addon}"$'\t'"${version}")
          done
          matrix="$(printf '%s\n' "${rows[@]}" | jq -c -R -s '
            split("\n")
            | map(select(length > 0) | split("\t") | {name: .[0], version: .[1]})
          ')"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "will sync $(jq 'length' <<<"${matrix}") add-ons"

  sync-images:
    name: Sync ${{ matrix.addon.name }} to Aliyun ACR
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: needs.prepare.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        addon: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Log in to Aliyun ACR
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          REG="$(printf '%s' "${ACR_REGISTRY}" | tr -d '[:space:]')"
          ACR_USER="$(printf '%s' "${ACR_USERNAME}" | tr -d '[:space:]')"
          PASS="$(printf '%s' "${ACR_PASSWORD}" | tr -d '[:space:]')"
          printf '%s' "${PASS}" | docker login "${REG}" --username "${ACR_USER}" --password-stdin
          echo "logged in to ${REG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sync images
        env:
          ADDON: ${{ matrix.addon.name }}
          VERSION: ${{ matrix.addon.version }}
          FORCE: ${{ inputs.force_sync || false }}
          DRY_RUN: "false"
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -uo pipefail

          PREFIX="${ACR_REGISTRY}/${ACR_NAMESPACE}"

          hassio_arch() {
            # Map a container platform (GOARCH + variant) to the HA arch name
            case "$1" in
              amd64) echo "amd64" ;;
              arm64) echo "aarch64" ;;
              386) echo "i386" ;;
              arm)
                case "${2:-}" in
                  v7) echo "armv7" ;;
                  *) echo "armhf" ;;
                esac ;;
              *) echo "$1" ;;
            esac
          }

          run_skopeo() {
            docker run --rm quay.io/skopeo/stable:latest "$@"
          }

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "- ⏳ **${ADDON}** \`${VERSION}\`: syncing" >> "${GITHUB_STEP_SUMMARY}"
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            echo "- 🔈 **${ADDON}** \`${VERSION}\`: dry run, nothing pushed" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          src="ghcr.io/hassio-addons/${ADDON}:${VERSION}"
          src_raw="$(docker buildx imagetools inspect --raw "${src}" 2>/dev/null || true)"
          if [ -z "${src_raw}" ]; then
            echo "- ⚠️ **${ADDON}** \`${VERSION}\`: upstream image not published yet" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # Real platforms only: unknown/unknown entries in the upstream index
          # are provenance/SBOM attestation manifests, which Aliyun ACR
          # rejects ("403 blob type invalid").
          plats="$(jq -r '.manifests[]?
            | select((.platform.os // "") != "unknown" and (.platform.architecture // "") != "unknown")
            | "\(.platform.architecture)\t\(.platform.variant // "")"' <<<"${src_raw}" | sort -u)"
          if [ -z "${plats}" ]; then
            echo "- ⚠️ **${ADDON}** \`${VERSION}\`: no platform manifests in upstream index" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # Aliyun ACR (personal edition) only accepts gzip-compressed docker
          # schema2 content, while upstream ships zstd-compressed OCI layers:
          # --format v2s2 --dest-compress-format gzip --dest-force-compress-format
          # converts on the fly. --override-* (global flags) additionally pick
          # exactly one platform out of the source index.
          synced=()
          failed=()
          while IFS=$'\t' read -r goarch variant; do
            harch="$(hassio_arch "${goarch}" "${variant}")"
            dst="${PREFIX}/${ADDON}-${harch}:${VERSION}"

            if [ "${FORCE}" != "true" ] && docker buildx imagetools inspect "${dst}" >/dev/null 2>&1; then
              synced+=("${harch} (already up to date)")
              continue
            fi

            override=(--override-os linux --override-arch "${goarch}")
            [ -n "${variant}" ] && override+=(--override-variant "${variant}")

            if run_skopeo copy \
                "${override[@]}" \
                --format v2s2 \
                --dest-compress-format gzip \
                --dest-force-compress-format \
                --src-no-creds \
                --dest-creds "${ACR_USERNAME}:${ACR_PASSWORD}" \
                "docker://${src}" "docker://${dst}"; then
              synced+=("${harch}")
            else
              failed+=("${harch}")
            fi
          done <<<"${plats}"

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "- ❌ **${ADDON}** \`${VERSION}\`: failed arch(es): ${failed[*]}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          tags=()
          while IFS=$'\t' read -r goarch variant; do
            tags+=("${PREFIX}/${ADDON}-$(hassio_arch "${goarch}" "${variant}"):${VERSION}")
          done <<<"${plats}"

          # Rebuild the plain multi-arch tag from the per-arch tags above
          if docker buildx imagetools create --tag "${PREFIX}/${ADDON}:${VERSION}" "${tags[@]}"; then
            echo "- ✅ **${ADDON}** \`${VERSION}\`: ${#synced[@]} platform(s) [${synced[*]}], index rebuilt" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "- ❌ **${ADDON}** \`${VERSION}\`: synced per-arch tags but index rebuild failed" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
