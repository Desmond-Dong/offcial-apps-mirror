---
name: Mirror upstream repository

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force_sync:
        description: Force re-sync all images, ignoring tags already in ACR
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: mirror-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: https://github.com/hassio-addons/repository.git
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: hassioapps
  REPO_NAME: Home Assistant Community Apps (Mirror)
  REPO_URL: https://github.com/Desmond-Dong/offcial-apps-mirror
  REPO_MAINTAINER: Desmond-Dong

jobs:
  mirror:
    name: Mirror repository files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Clone upstream repository
        run: git clone --depth 1 "$UPSTREAM_REPOSITORY" "$RUNNER_TEMP/upstream"

      - name: Mirror upstream tree
        run: rsync -a --delete --exclude '.git' --exclude '.github' "$RUNNER_TEMP/upstream/" ./

      - name: Point image references at ACR
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "ghcr.io/hassio-addons/"
          replace: "${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/"
          regex: false
          include: "*/config.yaml"

      - name: Turn arch placeholder into arch suffix
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "/{arch}"
          replace: "-{arch}"
          regex: false
          include: "*/config.yaml"

      - name: Point .apps.yml images at ACR
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "ghcr.io/hassio-addons/"
          replace: "${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/"
          regex: false
          include: ".apps.yml"

      - name: Point README at this repository
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "https://github.com/hassio-addons/repository"
          replace: "https://github.com/Desmond-Dong/offcial-apps-mirror"
          regex: false
          include: "README.md"

      - name: Write repository.json
        run: |
          jq -n \
            --arg name "$REPO_NAME" \
            --arg url "$REPO_URL" \
            --arg maintainer "$REPO_MAINTAINER" \
            '{name: $name, url: $url, maintainer: $maintainer}' > repository.json

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync upstream repository"

  sync-images:
    name: Sync images to Aliyun ACR
    needs: mirror
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check credential shape
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -uo pipefail
          echo "registry       = ${ACR_REGISTRY} (len=${#ACR_REGISTRY})"
          echo "registry_ok    = $(case "${ACR_REGISTRY}" in *://*) echo 'no: contains scheme' ;; *.*/*) echo 'no: contains path' ;; *.* ) echo yes ;; *) echo 'no: not a host' ;; esac)"
          echo "username_len   = ${#ACR_USERNAME}"
          echo "username_eq_reg= $(if [ -n "${ACR_USERNAME}" ] && [ "${ACR_USERNAME}" = "${ACR_REGISTRY}" ]; then echo yes; else echo no; fi)"
          echo "username_looks_like_host = $(case "${ACR_USERNAME}" in *.*.*.*.*.*) echo yes ;; *) echo no ;; esac)"
          echo "password_len   = ${#ACR_PASSWORD}"
          case "${ACR_PASSWORD}" in *[[:space:]]*) echo "password_ws    = yes (contains whitespace)" ;; *) echo "password_ws    = no" ;; esac

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Sync images
        env:
          FORCE: ${{ inputs.force_sync || false }}
          DRY_RUN: "false"
        run: |
          set -uo pipefail

          PREFIX="${ACR_REGISTRY}/${ACR_NAMESPACE}"
          SYNCED=0
          SKIPPED=0
          OUTDATED=0
          WARNED=0
          FAILED=0
          FAILURES=()

          copy_image() {
            src="$1"
            dst="$2"
            if [ "${DRY_RUN}" = "true" ]; then
              echo "dry-run ${src} -> ${dst}"
              SYNCED=$((SYNCED + 1))
              return 0
            fi

            src_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${src}" 2>/dev/null || true)"
            if [ -z "${src_digest}" ]; then
              echo "warn: source image not published yet: ${src}"
              WARNED=$((WARNED + 1))
              return 0
            fi

            dst_digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${dst}" 2>/dev/null || true)"
            if [ -z "${dst_digest}" ]; then
              echo "new ${dst} (not in ACR yet)"
            elif [ "${dst_digest}" = "${src_digest}" ] && [ "${FORCE}" != "true" ]; then
              echo "up to date ${dst} (${src_digest})"
              SKIPPED=$((SKIPPED + 1))
              return 0
            else
              echo "outdated ${dst}: ${dst_digest} -> ${src_digest}"
              OUTDATED=$((OUTDATED + 1))
            fi

            attempt=1
            while [ "${attempt}" -le 3 ]; do
              if docker buildx imagetools create --tag "${dst}" "${src}"; then
                echo "synced ${dst}"
                SYNCED=$((SYNCED + 1))
                return 0
              fi
              echo "attempt ${attempt} failed for ${dst}"
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            echo "failed ${dst}"
            FAILED=$((FAILED + 1))
            FAILURES+=("${dst}")
          }

          for cfg in */config.yaml; do
            addon="${cfg%/config.yaml}"
            version="$(awk '/^version:/{print $2; exit}' "${cfg}" | tr -d "\"'")"
            if [ -z "${version}" ]; then
              echo "skip ${addon}: config has no version"
              WARNED=$((WARNED + 1))
              continue
            fi
            if grep -q '{arch}' "${cfg}"; then
              archs="$(awk '
                /^arch:/ { f=1; next }
                f && /^[ \t]*- / { sub(/^[ \t]*- /, ""); print; next }
                f && !/^[ \t]*$/ { f=0 }
              ' "${cfg}")"
              if [ -z "${archs}" ]; then
                echo "skip ${addon}: arch placeholders but no arch list"
                WARNED=$((WARNED + 1))
                continue
              fi
              for arch in ${archs}; do
                copy_image \
                  "ghcr.io/hassio-addons/${addon}/${arch}:${version}" \
                  "${PREFIX}/${addon}-${arch}:${version}"
              done
            else
              copy_image \
                "ghcr.io/hassio-addons/${addon}:${version}" \
                "${PREFIX}/${addon}:${version}"
            fi
          done

          echo "done: synced=${SYNCED} up_to_date=${SKIPPED} outdated=${OUTDATED} warnings=${WARNED} failures=${FAILED}"

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Image sync"
              echo ""
              echo "- synced: ${SYNCED}"
              echo "- up to date (digest matches): ${SKIPPED}"
              echo "- outdated (digest differs, re-synced): ${OUTDATED}"
              echo "- warnings: ${WARNED}"
              echo "- failures: ${FAILED}"
              if [ "${FAILED}" -gt 0 ]; then
                echo ""
                for failure in "${FAILURES[@]}"; do
                  echo "- \`${failure}\`"
                done
              fi
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          [ "${FAILED}" -eq 0 ]
