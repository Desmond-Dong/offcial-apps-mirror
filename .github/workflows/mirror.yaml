---
name: Mirror upstream repository

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force_sync:
        description: Force re-sync all images, ignoring tags already in ACR
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: mirror-upstream
  cancel-in-progress: false

env:
  # Order matters: home-assistant/addons is processed first so official
  # add-ons always keep their original names; every other upstream that
  # hits an existing directory gets a numeric suffix on directory + slug.
  UPSTREAM_REPOSITORIES: "home-assistant/addons hassio-addons/repository esphome/home-assistant-addon music-assistant/home-assistant-addon"
  SKIP_ADDONS: "tor netease_cloud_music_api"
  # secrets hold the Tencent TCR personal registry credentials
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  REPO_NAME: Home Assistant Community Apps (Mirror)
  REPO_URL: https://github.com/Desmond-Dong/offcial-apps-mirror
  REPO_MAINTAINER: Desmond-Dong

jobs:
  # The repository tree is published only after every add-on image has been
  # pushed, so a config update can never reference an image that is not yet
  # pullable
  mirror:
    name: Mirror repository files
    needs: sync-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Clean previously mirrored add-ons
        run: |
          set -euo pipefail
          # Start from a clean managed set every run: the checkout contains
          # last run's tree, and stale directories would otherwise win name
          # collisions or hide upstream deletions
          for d in */; do
            if [ -f "${d}config.yaml" ] || [ -f "${d}config.json" ]; then
              rm -rf "${d}"
            fi
          done

      # Copy order decides name ownership: home-assistant/addons is first so
      # official add-ons always keep their original names; any other upstream
      # that collides gets a numeric suffix on directory + slug. Image
      # rewrites are applied afterwards, scoped to each upstream's own
      # directory list, so no replace step can touch another origin's files.
      - name: Mirror add-ons from upstreams
        run: |
          set -euo pipefail
          : > "${RUNNER_TEMP}/dirs-official.txt"
          : > "${RUNNER_TEMP}/dirs-hassio.txt"
          : > "${RUNNER_TEMP}/dirs-esphome.txt"
          : > "${RUNNER_TEMP}/dirs-music.txt"
          for repo in ${UPSTREAM_REPOSITORIES}; do
            case "${repo}" in
              home-assistant/addons) list="${RUNNER_TEMP}/dirs-official.txt" ;;
              hassio-addons/repository) list="${RUNNER_TEMP}/dirs-hassio.txt" ;;
              esphome/home-assistant-addon) list="${RUNNER_TEMP}/dirs-esphome.txt" ;;
              music-assistant/home-assistant-addon) list="${RUNNER_TEMP}/dirs-music.txt" ;;
              *) continue ;;
            esac
            dest="${RUNNER_TEMP}/upstream-${repo%%/*}"
            git clone --depth 1 --quiet "https://github.com/${repo}.git" "${dest}"
            for d in "${dest}"/*/; do
              d="${d%/}"
              name="$(basename "${d}")"
              if [ ! -f "${d}/config.yaml" ]; then
                continue
              fi
              target="${name}"
              if [ -e "./${target}" ]; then
                if [ "${repo}" = "home-assistant/addons" ]; then
                  echo "::warning::official ${name} shadows an existing directory, skipping"
                  continue
                fi
                try=2
                while [ -e "./${target}${try}" ]; do
                  try=$((try + 1))
                done
                target="${name}${try}"
                echo "renamed ${repo}/${name} -> ${target} (name collision)"
              fi
              rsync -a --delete "${d}/" "./${target}/"
              if [ "${target}" != "${name}" ]; then
                sed -i "s/^slug:.*/slug: ${target}/" "./${target}/config.yaml"
              fi
              echo "${target}" >> "${list}"
            done
            # hassio-addons repository metadata reused by later steps
            if [ "${repo}" = "hassio-addons/repository" ]; then
              [ -f "${dest}/.apps.yml" ] && cp "${dest}/.apps.yml" ./.apps.yml
              [ -f "${dest}/README.md" ] && cp "${dest}/README.md" ./README.md
            fi
          done

      - name: Point image references at registry per upstream
        env:
          REG: "${{ env.ACR_REGISTRY }}"
        run: |
          set -euo pipefail
          rewrite() {
            while IFS= read -r d; do
              [ -n "${d}" ] || continue
              sed -i "$2" "./${d}/config.yaml"
            done < "$1"
          }
          # hassio-addons: swap the ghcr host and turn the trailing /{arch}
          # placeholder into the -{arch} suffix the supervisor resolves
          rewrite "${RUNNER_TEMP}/dirs-hassio.txt" \
            "s|ghcr.io/hassio-addons/|${REG}/hassio-addons/|g; s|/{arch}|-{arch}|g"
          rewrite "${RUNNER_TEMP}/dirs-esphome.txt" \
            "s|ghcr.io/esphome/|${REG}/esphome/|g"
          rewrite "${RUNNER_TEMP}/dirs-music.txt" \
            "s|ghcr.io/music-assistant/|${REG}/music-assistant/|g"
          # official core add-ons use the supervisor alias homeassistant/
          rewrite "${RUNNER_TEMP}/dirs-official.txt" \
            "s|^image: homeassistant/|image: ${REG}/ha-apps/|"

      - name: Remove excluded add-ons
        run: |
          set -euo pipefail
          for name in ${SKIP_ADDONS}; do
            rm -rf "./${name}"
          done

      - name: Point .apps.yml images at ACR
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "ghcr.io/hassio-addons/"
          replace: "${{ env.ACR_REGISTRY }}/hassio-addons/"
          regex: false
          include: ".apps.yml"

      - name: Drop excluded apps from .apps.yml
        run: |
          python3 - <<'PY'
          import os
          skip = set(os.environ.get("SKIP_ADDONS", "").split())
          path = ".apps.yml"
          with open(path, encoding="utf-8") as f:
              lines = f.read().splitlines(True)
          out, drop = [], False
          for line in lines:
              if line and not line[0].isspace():
                  drop = False
              elif line.startswith("  ") and not line.startswith("    "):
                  drop = line.strip().rstrip(":") in skip
              if not drop:
                  out.append(line)
          with open(path, "w", encoding="utf-8") as f:
              f.write("".join(out))
          PY

      - name: Point README at this repository
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "https://github.com/hassio-addons/repository"
          replace: "https://github.com/Desmond-Dong/offcial-apps-mirror"
          regex: false
          include: "README.md"

      - name: Write repository.json
        run: |
          jq -n \
            --arg name "$REPO_NAME" \
            --arg url "$REPO_URL" \
            --arg maintainer "$REPO_MAINTAINER" \
            '{name: $name, url: $url, maintainer: $maintainer}' > repository.json

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: sync upstream repository"

  prepare:
    name: Prepare sync list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Build sync list from upstream configs
        id: list
        env:
          UPSTREAMS: "home-assistant/addons hassio-addons/repository esphome/home-assistant-addon music-assistant/home-assistant-addon"
        run: |
          set -euo pipefail
          # Mirror the mirror job's name allocation: first upstream to claim a
          # directory name keeps it (official goes first and is never
          # renamed); later colliding add-ons get a numeric suffix
          declare -A claimed=()
          # Sets CLAIMED and returns 0, or returns 1 when an official add-on
          # would shadow an existing one (official names are never renamed)
          claim_name() {
            local repo="$1" dir="$2" try=2 cand="${2}"
            if [ -z "${claimed[${cand}]:-}" ]; then
              claimed[${cand}]="${repo}"
              CLAIMED="${cand}"
              return 0
            fi
            if [ "${repo}" = "home-assistant/addons" ]; then
              return 1
            fi
            while :; do
              cand="${dir}${try}"
              if [ -z "${claimed[${cand}]:-}" ]; then
                claimed[${cand}]="${repo}"
                CLAIMED="${cand}"
                return 0
              fi
              try=$((try + 1))
            done
          }
          seen=""
          rows=()
          for repo in ${UPSTREAMS}; do
            dest="${RUNNER_TEMP}/up-${repo%%/*}"
            git clone --depth 1 --quiet "https://github.com/${repo}.git" "${dest}"
            for d in "${dest}"/*/; do
              d="${d%/}"
              cfg="${d}/config.yaml"
              [ -f "${cfg}" ] || continue
              dir_name="$(basename "${d}")"

              if ! claim_name "${repo}" "${dir_name}"; then
                echo "::warning::official ${dir_name} would shadow an existing add-on, skipping"
                continue
              fi
              final_name="${CLAIMED}"
              case " ${SKIP_ADDONS} " in *" ${final_name} "*) continue ;; esac
              case "${seen} " in *" ${final_name} "*) continue ;; esac

              version="$(awk '/^version:/{print $2; exit}' "${cfg}" | tr -d "\"'")"
              image="$(awk '/^image:/{print $2; exit}' "${cfg}" | tr -d "\"'")"
              if [ -z "${version}" ] || [ -z "${image}" ]; then
                echo "::warning::${final_name}: config has no version or no image, skipping"
                continue
              fi
              seen="${seen}${final_name} "

              # per-upstream registry namespace
              case "${repo}" in
                home-assistant/addons) ns="ha-apps" ;;
                hassio-addons/repository) ns="hassio-addons" ;;
                esphome/home-assistant-addon) ns="esphome" ;;
                music-assistant/home-assistant-addon) ns="music-assistant" ;;
                *) ns="hassioapps" ;;
              esac

              # no registry host (official core "homeassistant/..." and plain
              # docker hub images) -> docker.io
              case "${image%%/*}" in
                *.*) ;;
                *) image="docker.io/${image}" ;;
              esac

              # a trailing /{arch} placeholder (or no placeholder at all) means
              # the plain tag carries every platform (mode=index); an {arch}
              # left inside the path means one image per architecture
              # (mode=arch, official core add-ons)
              index_image="${image%%/\{arch\}}"
              case "${index_image}" in
                *"{arch}"*)
                  path="${index_image#*/}"
                  path="${path#*/}"
                  arches="$(awk '
                    /^arch:/ { f=1; next }
                    f && /^[ \t]*- / { sub(/^[ \t]*- /, ""); print; next }
                    f && !/^[ \t]*$/ { f=0 }
                  ' "${cfg}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
                  if [ -z "${arches}" ] || [ "${arches}" = "[]" ]; then
                    echo "::warning::${final_name}: arch image without arch list, skipping"
                    continue
                  fi
                  rows+=("${path}"$'\t'"${version}"$'\t'"${image}"$'\t'"${final_name}"$'\t'"arch"$'\t'"${arches}"$'\t'"${ns}")
                ;;
                *)
                  name="${index_image##*/}"
                  src="${index_image}"
                  rows+=("${name}"$'\t'"${version}"$'\t'"${src}"$'\t'"${final_name}"$'\t'"index"$'\t'"[]"$'\t'"${ns}")
                ;;
              esac
            done
          done
          matrix="$(printf '%s\n' "${rows[@]}" | jq -c -R -s '
            split("\n")
            | map(select(length > 0) | split("\t") |
                {name: .[0], version: .[1], src: .[2], label: .[3],
                 mode: .[4], arches: (.[5] | fromjson), ns: .[6]})
          ')"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          printf '%s' "${matrix}" > "${RUNNER_TEMP}/matrix.json"
          echo "will sync $(jq 'length' <<<"${matrix}") add-ons"

      - name: Pre-create repositories as public
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TENCENT_SECRET_ID}" ] || [ -z "${TENCENT_SECRET_KEY}" ]; then
            echo "::warning::TENCENT_SECRET_ID / TENCENT_SECRET_KEY not configured; new repositories will be created private and flipped after sync"
            exit 0
          fi
          pip install -q tencentcloud-sdk-python-tcr
          python3 - <<'PY'
          import json
          import os

          from tencentcloud.common import credential
          from tencentcloud.common.exception.tencent_cloud_sdk_exception import TencentCloudSDKException
          from tencentcloud.tcr.v20190924 import models, tcr_client

          with open(os.path.join(os.environ["RUNNER_TEMP"], "matrix.json"), encoding="utf-8") as f:
              matrix = json.load(f)

          cred = credential.Credential(os.environ["TENCENT_SECRET_ID"], os.environ["TENCENT_SECRET_KEY"])
          client = tcr_client.TcrClient(cred, "ap-guangzhou")

          repos = set()
          for item in matrix:
              ns = item["ns"]
              if item["mode"] == "arch":
                  for arch in item["arches"]:
                      repos.add(f"{ns}/" + item["name"].replace("{arch}", arch))
              else:
                  repos.add(f"{ns}/{item['name']}")

          created = skipped = 0
          for repo in sorted(repos):
              req = models.CreateRepositoryPersonalRequest()
              req.RepoName = repo
              req.Public = 1  # 1=public: anonymous pull from the moment images land
              req.Description = "Home Assistant Community Apps (Mirror)"
              try:
                  client.CreateRepositoryPersonal(req)
                  created += 1
              except TencentCloudSDKException as exc:
                  # already-existing repositories are left untouched here;
                  # the post-sync step flips any that are still private
                  print(f"note: {repo}: {exc}")
                  skipped += 1
          print(f"pre-created {created} public repositories, {skipped} already existed or skipped")
          PY

  sync-images:
    name: Sync ${{ matrix.addon.label }} to Aliyun ACR
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: needs.prepare.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      # Tencent TCR personal edition allows at most 10 concurrent syncs
      max-parallel: 10
      matrix:
        addon: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Log in to Aliyun ACR
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          REG="$(printf '%s' "${ACR_REGISTRY}" | tr -d '[:space:]')"
          ACR_USER="$(printf '%s' "${ACR_USERNAME}" | tr -d '[:space:]')"
          PASS="$(printf '%s' "${ACR_PASSWORD}" | tr -d '[:space:]')"
          printf '%s' "${PASS}" | docker login "${REG}" --username "${ACR_USER}" --password-stdin
          echo "logged in to ${REG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sync images
        env:
          ADDON: ${{ matrix.addon.name }}
          LABEL: ${{ matrix.addon.label }}
          SRC: ${{ matrix.addon.src }}
          VERSION: ${{ matrix.addon.version }}
          MODE: ${{ matrix.addon.mode }}
          ARCHES: ${{ toJson(matrix.addon.arches) }}
          NS: ${{ matrix.addon.ns }}
          FORCE: ${{ inputs.force_sync || false }}
          DRY_RUN: "false"
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -uo pipefail

          PREFIX="${ACR_REGISTRY}/${NS}"
          REPOS="repos.txt"
          : > "${REPOS}"

          hassio_arch() {
            # Map a container platform (GOARCH + variant) to the HA arch name
            case "$1" in
              amd64) echo "amd64" ;;
              arm64) echo "aarch64" ;;
              386) echo "i386" ;;
              arm)
                case "${2:-}" in
                  v7) echo "armv7" ;;
                  *) echo "armhf" ;;
                esac ;;
              *) echo "$1" ;;
            esac
          }

          go_arch() {
            # Inverse of hassio_arch for --override-arch/--override-variant
            case "$1" in
              amd64) echo "amd64" ;;
              aarch64) echo "arm64" ;;
              i386) echo "386" ;;
              armhf) echo "arm v6" ;;
              armv7) echo "arm v7" ;;
              *) echo "$1" ;;
            esac
          }

          run_skopeo() {
            docker run --rm quay.io/skopeo/stable:latest "$@"
          }

          # ACR personal edition rate limits the registry API (429); a failed
          # existence check must be retried before treating the tag as absent,
          # otherwise already-synced images get re-pushed every run.
          dst_exists() {
            local try=0
            while [ "${try}" -lt 3 ]; do
              if docker buildx imagetools inspect "$1" >/dev/null 2>&1; then
                return 0
              fi
              try=$((try + 1))
              [ "${try}" -lt 3 ] && sleep $((try * 5))
            done
            return 1
          }

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "- ⏳ **${LABEL}** (\`${PREFIX}/${ADDON}:${VERSION}\`): syncing" >> "${GITHUB_STEP_SUMMARY}"
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            echo "- 🔈 **${LABEL}**: dry run, nothing pushed" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # Aliyun ACR (personal edition) only accepts gzip-compressed docker
          # schema2 content, while upstream ships zstd-compressed OCI layers:
          # --format v2s2 --dest-compress-format gzip --dest-force-compress-format
          # converts on the fly. --override-* (global flags) additionally pick
          # exactly one platform out of a source index, dropping the
          # unknown/unknown provenance/SBOM attestation manifests that ACR
          # rejects ("403 blob type invalid").
          # docker.io anonymous pulls are rate limited: authenticate when the
          # source lives on docker.io, stay anonymous for ghcr.io.
          if [[ "${SRC}" == docker.io/* ]]; then
            src_creds=(--src-creds "${DOCKER_USERNAME}:${DOCKER_PASSWORD}")
          else
            src_creds=(--src-no-creds)
          fi

          copy_one() {
            local src_ref="$1" dst="$2" goarch="$3" variant="$4"
            local override=(--override-os linux --override-arch "${goarch}")
            [ -n "${variant}" ] && override+=(--override-variant "${variant}")
            run_skopeo copy \
              "${override[@]}" \
              --format v2s2 \
              --dest-compress-format gzip \
              --dest-force-compress-format \
              "${src_creds[@]}" \
              --dest-creds "${ACR_USERNAME}:${ACR_PASSWORD}" \
              "docker://${src_ref}" "docker://${dst}"
          }

          synced=()
          failed=()

          if [ "${MODE}" = "arch" ]; then
            # One image per architecture, named with {arch} inside the path
            # (official core add-ons: {arch}-addon-<name>)
            while IFS= read -r harch; do
              [ -n "${harch}" ] || continue
              set -- $(go_arch "${harch}")
              dst="${PREFIX}/${ADDON//\{arch\}/${harch}}:${VERSION}"
              src_ref="${SRC//\{arch\}/${harch}}:${VERSION}"
              echo "${NS}/${ADDON//\{arch\}/${harch}}" >> "${REPOS}"

              if [ "${FORCE}" != "true" ] && dst_exists "${dst}"; then
                synced+=("${harch} (already up to date)")
                continue
              fi

              if copy_one "${src_ref}" "${dst}" "$1" "${2:-}"; then
                synced+=("${harch}")
              else
                failed+=("${harch}")
              fi
            done <<<"$(jq -r '.[]' <<<"${ARCHES}")"
          else
            # Plain tag is a multi-arch index: copy every real platform to a
            # per-arch tag, then rebuild the plain tag as an index over them
            src="${SRC}:${VERSION}"
            src_raw="$(docker buildx imagetools inspect --raw "${src}" 2>/dev/null || true)"
            if [ -z "${src_raw}" ]; then
              echo "- ⚠️ **${LABEL}** \`${VERSION}\`: upstream image not published yet (${src})" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            plats="$(jq -r '.manifests[]?
              | select((.platform.os // "") != "unknown" and (.platform.architecture // "") != "unknown")
              | "\(.platform.architecture)\t\(.platform.variant // "")"' <<<"${src_raw}" | sort -u)"
            if [ -z "${plats}" ]; then
              echo "- ⚠️ **${LABEL}** \`${VERSION}\`: no platform manifests in upstream index" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi

            tags=()
            copied=0
            while IFS=$'\t' read -r goarch variant; do
              harch="$(hassio_arch "${goarch}" "${variant}")"
              dst="${PREFIX}/${ADDON}-${harch}:${VERSION}"
              echo "${NS}/${ADDON}-${harch}" >> "${REPOS}"

              if [ "${FORCE}" != "true" ] && dst_exists "${dst}"; then
                synced+=("${harch} (already up to date)")
                tags+=("${dst}")
                continue
              fi

              if copy_one "${src}" "${dst}" "${goarch}" "${variant}"; then
                synced+=("${harch}")
                tags+=("${dst}")
                copied=$((copied + 1))
              else
                failed+=("${harch}")
              fi
            done <<<"${plats}"

            # Rebuild the plain multi-arch tag only when something was pushed;
            # if every arch was already up to date the index is unchanged, and
            # re-publishing it would only burn ACR API quota (429s)
            if [ "${#failed[@]}" -eq 0 ] && [ "${copied}" -gt 0 ] && [ "${#tags[@]}" -gt 0 ]; then
              if ! docker buildx imagetools create --tag "${PREFIX}/${ADDON}:${VERSION}" "${tags[@]}"; then
                failed+=("index rebuild")
              fi
            fi
            echo "${NS}/${ADDON}" >> "${REPOS}"
          fi

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "- ❌ **${LABEL}** \`${VERSION}\`: failed: ${failed[*]}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          echo "- ✅ **${LABEL}** \`${VERSION}\`: ${#synced[@]} platform(s) [${synced[*]}]" >> "${GITHUB_STEP_SUMMARY}"

      - name: Set repositories public
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          NS: ${{ matrix.addon.ns }}
        run: |
          set -euo pipefail
          if [ -z "${TENCENT_SECRET_ID}" ] || [ -z "${TENCENT_SECRET_KEY}" ]; then
            echo "::warning::TENCENT_SECRET_ID / TENCENT_SECRET_KEY not configured, repositories stay private"
            exit 0
          fi
          pip install -q tencentcloud-sdk-python-tcr
          python3 - <<'PY'
          import os

          from tencentcloud.common import credential
          from tencentcloud.common.exception.tencent_cloud_sdk_exception import TencentCloudSDKException
          from tencentcloud.tcr.v20190924 import models, tcr_client

          repos = sorted({line.strip() for line in open("repos.txt", encoding="utf-8") if line.strip()})
          cred = credential.Credential(os.environ["TENCENT_SECRET_ID"], os.environ["TENCENT_SECRET_KEY"])
          client = tcr_client.TcrClient(cred, "ap-guangzhou")

          failed = []
          for repo in repos:
              req = models.ModifyRepositoryAccessPersonalRequest()
              req.RepoName = repo
              req.Public = 1  # 1=public (anonymous pull), 0=private
              try:
                  client.ModifyRepositoryAccessPersonal(req)
                  print(f"public: {repo}")
              except TencentCloudSDKException as exc:
                  # a repository that was never created (nothing pushed) has
                  # nothing to publish - ignore, anything else is fatal
                  print(f"warn: {repo}: {exc}")
                  failed.append(repo)

          if failed:
              raise SystemExit(f"failed to set public: {failed}")
          PY
