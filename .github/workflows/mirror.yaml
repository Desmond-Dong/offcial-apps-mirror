---
name: Mirror upstream repository

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force_sync:
        description: Force re-sync all images, ignoring tags already in ACR
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: mirror-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: https://github.com/hassio-addons/repository.git
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: hassioapps
  REPO_NAME: Home Assistant Community Apps (Mirror)
  REPO_URL: https://github.com/Desmond-Dong/offcial-apps-mirror
  REPO_MAINTAINER: Desmond-Dong

jobs:
  mirror:
    name: Mirror repository files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Clone upstream repository
        run: git clone --depth 1 "$UPSTREAM_REPOSITORY" "$RUNNER_TEMP/upstream"

      - name: Mirror upstream tree
        run: rsync -a --delete --exclude '.git' --exclude '.github' "$RUNNER_TEMP/upstream/" ./

      - name: Point image references at ACR
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "ghcr.io/hassio-addons/"
          replace: "${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/"
          regex: false
          include: "*/config.yaml"

      - name: Turn arch placeholder into arch suffix
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "/{arch}"
          replace: "-{arch}"
          regex: false
          include: "*/config.yaml"

      - name: Point .apps.yml images at ACR
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "ghcr.io/hassio-addons/"
          replace: "${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/"
          regex: false
          include: ".apps.yml"

      - name: Point README at this repository
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "https://github.com/hassio-addons/repository"
          replace: "https://github.com/Desmond-Dong/offcial-apps-mirror"
          regex: false
          include: "README.md"

      - name: Write repository.json
        run: |
          jq -n \
            --arg name "$REPO_NAME" \
            --arg url "$REPO_URL" \
            --arg maintainer "$REPO_MAINTAINER" \
            '{name: $name, url: $url, maintainer: $maintainer}' > repository.json

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync upstream repository"

  sync-images:
    name: Sync images to Aliyun ACR
    needs: mirror
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Log in to Aliyun ACR
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -uo pipefail

          REG="$(printf '%s' "${ACR_REGISTRY}" | tr -d '[:space:]')"
          ACR_USER="$(printf '%s' "${ACR_USERNAME}" | tr -d '[:space:]')"
          PASS="$(printf '%s' "${ACR_PASSWORD}" | tr -d '[:space:]')"

          echo "registry        : ${REG}"
          if [ "${#ACR_USER}" -ge 8 ]; then
            echo "username        : ${ACR_USER:0:3}****${ACR_USER: -3} (len=${#ACR_USER})"
          else
            echo "username        : len=${#ACR_USER}"
          fi
          echo "password len    : ${#PASS}"
          case "${ACR_REGISTRY}"  in *[[:space:]]*) echo "note: ACR_REGISTRY had surrounding whitespace, trimmed"  ;; esac
          case "${ACR_USERNAME}"  in *[[:space:]]*) echo "note: ACR_USERNAME had surrounding whitespace, trimmed"  ;; esac
          case "${ACR_PASSWORD}"  in *[[:space:]]*) echo "note: ACR_PASSWORD had surrounding whitespace, trimmed"  ;; esac

          challenge="$(curl -sS -D - -o /dev/null --max-time 30 "https://${REG}/v2/" | tr -d '\r' | grep -i '^www-authenticate:' || true)"
          realm="$(printf '%s' "${challenge}" | sed -E 's/.*realm="([^"]+)".*/\1/')"
          service="$(printf '%s' "${challenge}" | sed -E 's/.*service="([^"]+)".*/\1/')"
          echo "auth realm      : ${realm}"

          probe() {
            local label="$1" user="$2" pass="$3" body code
            code="$(curl -sS -o /tmp/auth_probe.json -w '%{http_code}' --max-time 30 -u "${user}:${pass}" "${realm}?service=${service}" 2>/dev/null || true)"
            body="$(cat /tmp/auth_probe.json 2>/dev/null || true)"
            if [ "${code}" = "200" ]; then
              echo "auth probe[${label}]: HTTP 200 - credentials ACCEPTED by Aliyun"
            else
              echo "auth probe[${label}]: HTTP ${code:-n/a} ${body}"
            fi
          }

          probe raw "${ACR_USERNAME}" "${ACR_PASSWORD}"
          probe trimmed "${ACR_USER}" "${PASS}"

          printf '%s' "${PASS}" | docker login "${REG}" --username "${ACR_USER}" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sync images
        env:
          FORCE: ${{ inputs.force_sync || false }}
          DRY_RUN: "false"
        run: |
          set -uo pipefail

          PREFIX="${ACR_REGISTRY}/${ACR_NAMESPACE}"
          SYNCED=0
          SKIPPED=0
          OUTDATED=0
          WARNED=0
          FAILED=0
          FAILURES=()

          # Aliyun ACR rejects provenance/SBOM attestation blobs (in-toto layers)
          # with "403 Forbidden: blob type invalid", so rebuild the destination
          # index from the real-platform sub-manifests only, skipping the
          # unknown/unknown attestation manifests that upstream ships.
          plat_key() {
            jq -r '
              if ((.manifests // []) | length) > 0 then
                [.manifests[]
                  | select((.platform.os // "") != "unknown" and (.platform.architecture // "") != "unknown")
                  | .digest]
              else
                [.config.digest // "unknown"]
              end
              | sort | join(" ")
            '
          }

          copy_image() {
            src="$1"
            dst="$2"
            if [ "${DRY_RUN}" = "true" ]; then
              echo "dry-run ${src} -> ${dst}"
              SYNCED=$((SYNCED + 1))
              return 0
            fi

            src_raw="$(docker buildx imagetools inspect --raw "${src}" 2>/dev/null || true)"
            if [ -z "${src_raw}" ]; then
              echo "warn: source image not published yet: ${src}"
              WARNED=$((WARNED + 1))
              return 0
            fi

            src_key="$(plat_key <<<"${src_raw}")"
            is_index="no"
            if jq -e '((.manifests // []) | length) > 0' >/dev/null 2>&1 <<<"${src_raw}"; then
              is_index="yes"
            fi

            dst_raw="$(docker buildx imagetools inspect --raw "${dst}" 2>/dev/null || true)"
            dst_key=""
            if [ -n "${dst_raw}" ]; then
              dst_key="$(plat_key <<<"${dst_raw}")"
            fi

            if [ -z "${dst_key}" ]; then
              echo "new ${dst} (not in ACR yet)"
            elif [ "${dst_key}" = "${src_key}" ] && [ "${FORCE}" != "true" ]; then
              echo "up to date ${dst} (${src_key})"
              SKIPPED=$((SKIPPED + 1))
              return 0
            else
              echo "outdated ${dst}"
              OUTDATED=$((OUTDATED + 1))
            fi

            attempt=1
            while [ "${attempt}" -le 3 ]; do
              create_ok=0
              if [ "${is_index}" = "yes" ]; then
                refs=()
                for d in ${src_key}; do
                  refs+=("${src}@${d}")
                done
                if [ "${#refs[@]}" -gt 1 ]; then
                  docker buildx imagetools create --tag "${dst}" "${refs[@]}" && create_ok=1
                elif [ "${#refs[@]}" -eq 1 ]; then
                  docker buildx imagetools create --tag "${dst}" "${refs[0]}" && create_ok=1
                else
                  docker buildx imagetools create --tag "${dst}" "${src}" && create_ok=1
                fi
              else
                docker buildx imagetools create --tag "${dst}" "${src}" && create_ok=1
              fi
              if [ "${create_ok}" = "1" ]; then
                echo "synced ${dst}"
                docker buildx imagetools inspect "${dst}" 2>/dev/null | grep "Platform:" | sed 's/^/    /'
                SYNCED=$((SYNCED + 1))
                return 0
              fi
              echo "attempt ${attempt} failed for ${dst}"
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            echo "failed ${dst}"
            FAILED=$((FAILED + 1))
            FAILURES+=("${dst}")
          }

          for cfg in */config.yaml; do
            addon="${cfg%/config.yaml}"
            version="$(awk '/^version:/{print $2; exit}' "${cfg}" | tr -d "\"'")"
            if [ -z "${version}" ]; then
              echo "skip ${addon}: config has no version"
              WARNED=$((WARNED + 1))
              continue
            fi
            if grep -q '{arch}' "${cfg}"; then
              archs="$(awk '
                /^arch:/ { f=1; next }
                f && /^[ \t]*- / { sub(/^[ \t]*- /, ""); print; next }
                f && !/^[ \t]*$/ { f=0 }
              ' "${cfg}")"
              if [ -z "${archs}" ]; then
                echo "skip ${addon}: arch placeholders but no arch list"
                WARNED=$((WARNED + 1))
                continue
              fi
              for arch in ${archs}; do
                copy_image \
                  "ghcr.io/hassio-addons/${addon}/${arch}:${version}" \
                  "${PREFIX}/${addon}-${arch}:${version}"
              done
            else
              copy_image \
                "ghcr.io/hassio-addons/${addon}:${version}" \
                "${PREFIX}/${addon}:${version}"
            fi
          done

          echo "done: synced=${SYNCED} up_to_date=${SKIPPED} outdated=${OUTDATED} warnings=${WARNED} failures=${FAILED}"

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Image sync"
              echo ""
              echo "- synced: ${SYNCED}"
              echo "- up to date (platform manifests match): ${SKIPPED}"
              echo "- outdated (digest differs, re-synced): ${OUTDATED}"
              echo "- warnings: ${WARNED}"
              echo "- failures: ${FAILED}"
              if [ "${FAILED}" -gt 0 ]; then
                echo ""
                for failure in "${FAILURES[@]}"; do
                  echo "- \`${failure}\`"
                done
              fi
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          [ "${FAILED}" -eq 0 ]
